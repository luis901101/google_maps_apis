name: Dart

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        sdk: [stable, beta]

    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}

      - name: Install dependencies
        run: dart pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project source
        run: dart analyze --fatal-infos

      - name: Run tests
        # The legacy url-building tests expect this literal placeholder as the key; it is not a
        # real key. Tests that call the Places API (New) skip themselves with this value.
        env:
          GOOGLE_API_KEY: GOOGLE_API_KEY
        run: dart test --coverage=coverage

      - name: Format coverage
        run: dart run coverage:format_coverage --package . --report-on lib -i coverage --lcov -o coverage/lcov.info

      - name: Upload coverage to codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
